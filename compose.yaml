name: opts2026-local

services:
  opts:
    container_name: opts2026
    image: opts2026:local
    build:
      context: .
      args:
        VITE_REVERB_APP_KEY: ${REVERB_APP_KEY:?Set REVERB_APP_KEY in .env}
        VITE_REVERB_HOST: opts.lgu.lan
        VITE_REVERB_PORT: "443"
        VITE_REVERB_SCHEME: https
    env_file:
      - .env
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: https://opts.lgu.lan
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: "3306"
      SESSION_DOMAIN: opts.lgu.lan
      SESSION_COOKIE: opts_session
      SESSION_SECURE_COOKIE: "true"
      SESSION_SAME_SITE: lax
      TRUSTED_PROXIES: "*"
      SSO_API_URL: https://sso.lgu.lan
      SSO_UI_URL: https://sso-portal.lgu.lan
      SSO_REDIRECT_URI: https://opts.lgu.lan/auth/sso/callback
      REVERB_HOST: 127.0.0.1
      REVERB_PORT: "6001"
      REVERB_SCHEME: http
      REVERB_SERVER_PORT: "6001"
    restart: unless-stopped
    ports:
      - "127.0.0.1:18086:8080"
    # Local trusted HTTPS paths; remote MIS deployment owns its DNS and CA mounts.
    extra_hosts:
      - "connect.lgu.lan:host-gateway"
      - "sso.lgu.lan:host-gateway"
    volumes:
      - opts_storage:/var/www/html/storage
      - "${LGU_LOCAL_CA_FILE:?Set the public local CA certificate path}:/etc/ssl/certs/lgu-local-rootCA.pem:ro"
      - ./docker/connect-local-ca.ini:/usr/local/etc/php/conf.d/zz-connect-local-ca.ini:ro
    healthcheck:
      test: ["CMD", "wget", "--spider", "--quiet", "http://127.0.0.1:8080/up"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=dev-net"
      - "traefik.http.routers.opts.rule=Host(`opts.lgu.lan`)"
      - "traefik.http.routers.opts.entrypoints=websecure"
      - "traefik.http.routers.opts.tls=true"
      - "traefik.http.routers.opts.service=opts"
      - "traefik.http.services.opts.loadbalancer.server.port=8080"
      - "traefik.http.routers.opts-reverb.rule=Host(`opts.lgu.lan`) && (PathPrefix(`/app/`) || PathPrefix(`/apps/`))"
      - "traefik.http.routers.opts-reverb.entrypoints=websecure"
      - "traefik.http.routers.opts-reverb.tls=true"
      - "traefik.http.routers.opts-reverb.service=opts-reverb"
      - "traefik.http.services.opts-reverb.loadbalancer.server.port=6001"
    networks:
      - dev-net

networks:
  dev-net:
    external: true

volumes:
  opts_storage:
