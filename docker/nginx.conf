# Never log query strings: SSO callbacks contain one-use authorization codes.
log_format edts_safe '$remote_addr - $request_method $uri $server_protocol $status $body_bytes_sent';
access_log /dev/stdout edts_safe;

server {
    listen 8080;
    server_name _;
    root /var/www/html/public;
    index index.php;

    charset utf-8;

    client_max_body_size 512M;

    # Keep callback error suppression through front-controller routing.
    location = /auth/sso/callback {
        access_log off;
        error_log /dev/null emerg;
        rewrite ^ /index.php break;
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    error_page 404 /index.php;

    location ~ \.php$ {
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
