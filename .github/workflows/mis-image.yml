name: MIS image

on:
  pull_request:
    branches: [staging, main]
  push:
    branches: [staging]

permissions:
  contents: read

concurrency:
  group: mis-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  php:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite
          coverage: none
      - run: composer install --prefer-dist --no-interaction --no-progress
      - run: cp .env.example .env
      - run: php artisan key:generate
      - run: php -d memory_limit=512M vendor/bin/phpunit --colors=never
      - name: Check delivery PHP formatting
        run: |
          vendor/bin/pint --test app/Console/Commands/DeploymentCheck.php tests/Feature/DeploymentCheckTest.php tests/Feature/ReverbRuntimeConfigTest.php \
            app/Services/ConnectPilotHost.php app/Http/Controllers/ConnectPilotController.php \
            app/Http/Controllers/Auth/SSOController.php app/Http/Middleware/EnsureSsoEligibility.php \
            app/Http/Middleware/HandleInertiaRequests.php config/connect_pilot.php routes/connect.php \
            tests/Feature/ConnectPilotTest.php database/migrations/2026_10_09_000000_create_connect_pilot_revocations_table.php

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: node scripts/check-php-amount.cjs
      - run: node --test tests/frontend/connect-widget.test.cjs
      - run: npm run build
      - name: Check deployment contract
        run: python3 scripts/check-mis-deployment.py

  image:
    needs: [php, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Export the tested immutable image
        env:
          IMAGE: mis-opts
        run: |
          docker buildx build --platform linux/amd64 \
            --label org.opencontainers.image.revision="$GITHUB_SHA" \
            --label org.opencontainers.image.source="https://github.com/$GITHUB_REPOSITORY" \
            --tag "$IMAGE:$GITHUB_SHA" --output type=docker,dest=image.tar .
          gzip image.tar
          sha256sum image.tar.gz > image.tar.gz.sha256
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'push' && github.ref == 'refs/heads/staging'
        with:
          name: mis-image-${{ github.sha }}
          path: |
            image.tar.gz
            image.tar.gz.sha256
          retention-days: 14
          if-no-files-found: error
