name: mis-production-opts
services:
  web:
    image: ${APP_IMAGE:?Set the verified immutable image ID}
    env_file: /srv/mis-deployment/opts/production/runtime.env
    environment:
      APP_ENV: production
      APP_DEBUG: 'false'
      APP_URL: https://opts.lguquezon.local
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: '3306'
      SESSION_DRIVER: database
      SESSION_COOKIE: opts_session
      SESSION_DOMAIN: 'null'
      SESSION_ENCRYPT: 'true'
      SESSION_SECURE_COOKIE: 'true'
      SESSION_HTTP_ONLY: 'true'
      SESSION_SAME_SITE: lax
      SSO_API_URL: https://api.sso.lguquezon.local
      SSO_UI_URL: https://sso.lguquezon.local
      SSO_REDIRECT_URI: https://opts.lguquezon.local/auth/sso/callback
      TRUSTED_PROXIES: '*'
      BROADCAST_CONNECTION: reverb
      REVERB_PUBLIC_HOST: opts.lguquezon.local
      REVERB_PUBLIC_PORT: '443'
      REVERB_PUBLIC_SCHEME: https
      REVERB_HOST: 127.0.0.1
      REVERB_PORT: '6001'
      REVERB_SCHEME: http
      REVERB_SERVER_PORT: '6001'
      QUEUE_CONNECTION: database
      CACHE_STORE: database
      MAIL_MAILER: log
    dns: [192.168.32.6]
    networks:
      data: null
      ingress:
        aliases: [mis-production-opts-web]
    volumes:
      - storage:/var/www/html/storage
      - /home/mis-ubuntu-1/lguquezon/infra/certs/lguquezonCA.crt:/etc/ssl/certs/mis-rootCA.crt:ro
      - /srv/mis-deployment/opts/production/trusted-ca.ini:/usr/local/etc/php/conf.d/zz-mis-ca.ini:ro
    mem_limit: 768m
    restart: unless-stopped
    healthcheck:
      test: [CMD, wget, --spider, --quiet, http://127.0.0.1:8080/up]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 90s
  mysql:
    image: mysql:8.4.11
    env_file: /srv/mis-deployment/opts/production/database.env
    command: [--innodb-buffer-pool-size=128M, --performance-schema=OFF, --max-connections=80]
    networks: [data]
    volumes: [mysql:/var/lib/mysql]
    mem_limit: 512m
    restart: unless-stopped
    healthcheck:
      test: [CMD, mysqladmin, ping, --host=127.0.0.1, --silent]
      interval: 10s
      timeout: 5s
      retries: 15
volumes:
  storage:
  mysql:
networks:
  data:
    internal: true
  ingress:
    external: true
    name: lgu-sso-ingress
