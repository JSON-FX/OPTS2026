# Install inside the existing proxy http context after exact-SAN issuance.
log_format opts_production_safe '$remote_addr - $remote_user [$time_local] '
    '"$request_method $uri $server_protocol" $status $body_bytes_sent';
server {
    listen 80;
    server_name opts.lguquezon.local;
    return 301 https://opts.lguquezon.local$request_uri;
}
server {
    listen 443 ssl;
    access_log /var/log/nginx/access.log opts_production_safe;
    server_name opts.lguquezon.local;
    ssl_certificate /etc/nginx/certs/opts-production.fullchain.crt;
    ssl_certificate_key /etc/nginx/certs/opts-production.key;
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $opts_web mis-production-opts-web:8080;
    set $opts_ws mis-production-opts-web:6001;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    location = /auth/sso/callback {
        access_log off;
        proxy_pass http://$opts_web;
    }
    location /app/ {
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 90s;
        proxy_pass http://$opts_ws;
    }
    location / { proxy_pass http://$opts_web; }
}
